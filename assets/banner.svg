<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Gibrail Zaidi, Software Developer building AI products">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14224a"/></linearGradient>
<style>
.t{font-family:Helvetica,Arial,sans-serif}
.flow{stroke:#475569;stroke-width:3;stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
.ring{fill:none;stroke:#60a5fa;stroke-width:3;opacity:0;animation:pulse 5s ease-in-out infinite}
.ring.live{stroke:#4ade80}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes pulse{0%{opacity:0;transform:scale(.8)}12%{opacity:.9;transform:scale(1)}30%{opacity:0;transform:scale(1.35)}100%{opacity:0}}
.ring{transform-box:fill-box;transform-origin:center}
</style>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<rect x="0" y="0" width="8" height="300" rx="4" fill="#2563eb"/>
<text class="t" x="60" y="92" fill="#93c5fd" font-size="16" letter-spacing="4">GIBRAIL ZAIDI</text>
<text class="t" x="60" y="156" fill="#ffffff" font-size="54" font-weight="700">Software Developer</text>
<text class="t" x="60" y="202" fill="#cbd5e1" font-size="21">LLM agents  |  MCP  |  Evals  |  Human-in-the-loop</text>
<text class="t" x="60" y="242" fill="#94a3b8" font-size="17">AI products, and a deployed payment-risk platform</text>
<g>
<line class="flow" x1="704" y1="130" x2="773" y2="130"/>
<line class="flow" x1="821" y1="130" x2="890" y2="130"/>
<line class="flow" x1="938" y1="130" x2="1007" y2="130"/>
<line class="flow" x1="1055" y1="130" x2="1124" y2="130"/>
<circle cx="680" cy="130" r="24" fill="#1d4ed8"/><circle class="ring" cx="680" cy="130" r="34" style="animation-delay:0s"/>
<circle cx="797" cy="130" r="24" fill="#1d4ed8"/><circle class="ring" cx="797" cy="130" r="34" style="animation-delay:1s"/>
<circle cx="914" cy="130" r="24" fill="#d97706"/><circle class="ring" cx="914" cy="130" r="34" style="animation-delay:2s"/>
<circle cx="1031" cy="130" r="24" fill="#7c3aed"/><circle class="ring" cx="1031" cy="130" r="34" style="animation-delay:3s"/>
<circle cx="1148" cy="130" r="24" fill="#16a34a"/><circle class="ring live" cx="1148" cy="130" r="34" style="animation-delay:4s"/>
<g class="t" fill="#e2e8f0" font-size="15" text-anchor="middle">
<text x="680" y="190">Plan</text><text x="797" y="190">Tools</text><text x="914" y="190">Verify</text><text x="1031" y="190">Approve</text><text x="1148" y="190">Live</text>
</g>
<text class="t" x="914" y="240" fill="#94a3b8" font-size="14" text-anchor="middle">agent workflow with quality gates and human approval</text>
</g>
</svg>
